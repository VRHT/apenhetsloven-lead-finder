name: Update company data weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Kjør hver mandag kl 08:00 norsk tid
  workflow_dispatch: # Mulig å kjøre manuelt fra GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: |
          echo "🚀 Kjører oppdatering av selskapsdata..."
          python main.py

      - name: Log update summary
        run: |
          echo ""
          echo "======================================"
          echo "🕒 Sist oppdatert: $(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "📊 Antall selskaper i data/companies.csv: $(($(wc -l < data/companies.csv)-1))"
          echo "======================================"
          echo ""

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/companies.csv README.md || true
          git diff-index --quiet HEAD || git commit -m "Auto-update CSV [skip ci]"
          git push
