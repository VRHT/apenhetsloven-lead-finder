name: Update company data weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Kjør hver mandag kl 08:00 norsk tid
  workflow_dispatch: # Mulig å kjøre manuelt fra GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print current time (CET)
        run: |
          echo "🕒 Workflow kjørt: $(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Run update script
        run: |
          python main.py

      - name: Update README timestamp
        run: |
          echo "🕒 Sist oppdatert: $(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')" > LAST_UPDATED.txt
          if grep -q "🕒 Sist oppdatert:" README.md; then
            sed -i 's/🕒 Sist oppdatert:.*/🕒 Sist oppdatert: '"$(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')"'/' README.md
          else
            echo "" >> README.md
            echo "🕒 Sist oppdatert: $(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')" >> README.md
          fi

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/companies.csv README.md || true
          git diff-index --quiet HEAD || git commit -m "Auto-update CSV and README timestamp [skip ci]"
          git push
# Trigger workflow Sun Oct 26 22:40:40 CET 2025
