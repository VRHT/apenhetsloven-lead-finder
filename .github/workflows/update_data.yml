name: Update company data weekly

on:
  schedule:
    - cron: "0 8 * * 1" # Kjør hver mandag kl 08:00 norsk tid
  workflow_dispatch: # Mulig å kjøre manuelt fra GitHub

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: |
          python main.py

      - name: Generate README update (timestamp + count)
        shell: bash
        run: |
          echo "🕒 Sist oppdatert: $(TZ='Europe/Oslo' date '+%Y-%m-%d %H:%M:%S %Z')" > TEMP_README.md
          echo "" >> TEMP_README.md
          echo "📊 Antall selskaper: $(($(wc -l < data/companies.csv)-1))" >> TEMP_README.md
          echo "" >> TEMP_README.md
          tail -n +1 README.md >> TEMP_README.md
          mv TEMP_README.md README.md

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/companies.csv README.md
          git diff-index --quiet HEAD || git commit -m "Auto-update CSV and README [skip ci]"
          git push
