name: Update company data weekly

on:
  push:
    branches:
      - main
  workflow_dispatch: # Mulig å kjøre manuelt fra GitHub
  schedule:
    - cron: "0 8 * * 1" # Kjører hver mandag kl. 08:00

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run update script
        run: |
          python main.py

      - name: Log last line of companies.csv
        run: |
          echo "---- Siste linje i data/companies.csv ----"
          tail -n 1 data/companies.csv || echo "companies.csv ikke funnet"
          echo "------------------------------------------"

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update data"
            git push
          else
            echo "Ingen endringer å pushe"
          fi
