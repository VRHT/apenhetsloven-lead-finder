name: Update company data weekly

on:
  schedule:
    - cron: "0 9 * * 1" # hver mandag kl. 09:00 UTC
  workflow_dispatch: # lar deg kjøre den manuelt

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data update
        run: python main.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.csv
          git commit -m "Automated weekly data update" || echo "No changes to commit"
          git push
